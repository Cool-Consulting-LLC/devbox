# Drop-in for Ubuntu's apt-daily-upgrade.timer. Yerevan time whatever the box's timezone,
# with no random delay. The empty OnCalendar= clears Ubuntu's schedule. Same
# time as apt-daily.timer: apt-daily-upgrade.service is ordered after
# apt-daily.service, so it installs from the lists that run just fetched.
[Timer]
OnCalendar=
OnCalendar=*-*-* 04:00 Asia/Yerevan
RandomizedDelaySec=0
