# /etc/tmux.conf on the devbox. ~/.tmux.conf still overrides.
set  -g default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc"
set  -g mouse on
set  -s escape-time 10
set  -g history-limit 50000
setw -g aggressive-resize on

# Prefix is C-a instead of C-b; C-a C-a sends a literal C-a to the program inside.
set  -g prefix C-a
unbind C-b
bind C-a send-prefix

# Copying: a mouse drag selects in copy mode and copies to the laptop's clipboard
# over OSC 52, which ssh and mosh 1.4 pass through. `on` rather than the default
# `external` also passes through OSC 52 from programs inside, like Claude Code.
# Releasing the drag keeps the selection on screen instead of jumping to the
# bottom; click to clear it, q to leave copy mode. Option-drag in iTerm2 (Shift
# in most other terminals) bypasses tmux and uses the terminal's own selection.
set  -s set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# Status line: each session gets its own colour (devbox-tmux-colour), the current
# tab is a solid block in that colour, and long session names keep their tail.
set  -g status-interval 15
set  -g status-left-length 32
set  -g status-left '#[bg=#{?client_prefix,colour255,#{@accent}},fg=colour16,bold] #{=/-24/…:session_name} #[default] '
set  -g status-right-length 40
set  -g status-right '#{?#{e|>:#{server_sessions},1},#[fg=colour245]#{server_sessions} sessions  ,}#[fg=colour252]%H:%M '
setw -g window-status-separator ''
setw -g window-status-format ' #I #W#{?window_zoomed_flag, [Z],}#{?window_bell_flag, !,}#{?window_activity_flag, *,} '
setw -g window-status-style 'fg=colour248'
setw -g window-status-current-format '#[bg=#{@accent},fg=colour16,bold] #I #W#{?window_zoomed_flag, [Z],} '
setw -g window-status-bell-style 'fg=colour203,bold'
set-hook -g session-created 'run-shell -b "devbox-tmux-colour #{q:session_name}"'
run-shell -b 'devbox-tmux-colour'
